<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NetTower Pro - نظام إدارة الأبراج</title>
<!-- Google Fonts: Tajawal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- ملف التنسيقات الأساسي -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- شاشة خطأ إذا فشل تحميل Vue -->
<div id="vue-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#0B1120;color:#EF4444;font-family:Tajawal,sans-serif;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;text-align:center;direction:rtl">
  <div style="font-size:48px">⚠️</div>
  <h2 style="color:#F9FAFB;font-size:20px">فشل تحميل المكتبات الأساسية</h2>
  <p style="color:#94A3B8;max-width:400px;line-height:1.8">تأكد من اتصالك بالإنترنت. إذا كنت تستخدم VPN أو Proxy، حاول تعطيله. أو استخدم متصفحاً آخر.</p>
</div>

<!-- Toast و Modal خارج Vue لأنها تُستدعى من دوال عامة -->
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="mhead">
    <h3 id="modalTitle">العنوان</h3>
    <button onclick="closeModal()"><i class="fas fa-times"></i></button>
  </div>
  <div id="modalBody"></div>
</div>

<!-- نقطة ربط Vue -->
<div id="app"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B1120;color:#94A3B8;font-family:Tajawal,sans-serif;font-size:16px">جاري تحميل النظام...</div></div>

<!-- Vue 3 + Vue Router 4 عبر CDN مع fallback -->
<script>
// التحقق من نجاح تحميل Vue
window.__vueLoaded = false;
window.__routerLoaded = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"
        onload="window.__vueLoaded = true"
        onerror="document.getElementById('vue-error').style.display='flex'"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js"
        onload="window.__routerLoaded = true"
        onerror="document.getElementById('vue-error').style.display='flex'"></script>

<!-- دوال Vue/VueRouter المشتركة (يجب أن يكون أول ملف بعد CDN) -->
<script src="js/shared.js"></script>

<!-- طبقة البيانات -->
<script src="js/data.js"></script>

<!-- صفحات النظام (كل صفحة في ملف منفصل) -->
<script src="js/pages/HomePage.js"></script>
<script src="js/pages/SubscribersPage.js"></script>
<script src="js/pages/AddSubPage.js"></script>
<script src="js/pages/SubDetailPage.js"></script>
<script src="js/pages/WhatsAppPage.js"></script>
<script src="js/pages/FinancePage.js"></script>
<script src="js/pages/ArchivePage.js"></script>
<script src="js/pages/ReportsPage.js"></script>
<script src="js/pages/NotificationsPage.js"></script>
<script src="js/pages/SettingsPage.js"></script>

<!-- مكونات التخطيط (Layout Components) -->
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>

<!-- دوال عامة للمودالات -->
<script src="js/globals.js"></script>

<!-- تشغيل التطبيق (يجب أن يكون آخر ملف) -->
<script src="js/app.js"></script>

</body>
</html>
